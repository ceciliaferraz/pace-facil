<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaceFácil - Calculadora de Ritmo para Corredores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🏃‍♂️ PaceFácil</h1>
        <p class="subtitle">Calcule seu ritmo por km e a velocidade exata para a esteira.</p>

        <div class="form-group">
            <label for="distancia">Distância (quilômetros):</label>
            <input type="number" id="distancia" placeholder="Ex: 5 ou 10" step="0.1">
        </div>

        <div class="form-group">
            <label for="tempo">Tempo Desejado (minutos):</label>
            <input type="number" id="tempo" placeholder="Ex: 30 ou 50">
        </div>

        <button onclick="calcularPace()">Calcular Ritmo</button>

        <div id="resultado" class="resultado hidden">
            <h2>Resultado:</h2>
            <div class="card-result">
                <span class="label-res">Seu Pace Médio:</span>
                <span id="resPace" class="value-res">--</span>
            </div>
            <div class="card-result">
                <span class="label-res">Velocidade na Esteira:</span>
                <span id="resEsteira" class="value-res">--</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <div style="text-align: center; margin: 30px 0; color: #94a3b8; font-size: 0.85rem;">
        👀 Pessoas que já acessaram: <img src="https://api.counterapi.dev/v1/ceciliaferraz/pace-facil/count" alt="Contador de Visitas" style="vertical-align: middle; margin-left: 5px;" />
    </div>
</body>
</html>
